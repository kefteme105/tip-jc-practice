<!doctype html><html lang="ru"><meta charset="utf-8"><title>КР2 Проверки 1, 3, 4</title><style>body{font:18px system-ui;padding:28px}button{padding:12px;margin:8px}pre{white-space:pre-wrap;font:16px monospace}</style><h1>КР2 — проверочные запуски</h1><button id="one">1. Проверить название</button><button id="three">3. Получить задачи</button><button id="four">4. Проверить HTTP-ошибку</button><pre id="out"></pre><script type="module">
import {validateTaskDraft} from '../src/form-validation.js';
import {createApiClient} from './kr2-api/api-client.js';
import {createTaskApi} from './kr2-api/task-api.js';
const api=createTaskApi(createApiClient({baseUrl:'http://127.0.0.1:5505/api'}));
const show=(text)=>{out.textContent+=text+'\n';console.log(text)};
one.onclick=()=>{out.textContent='';console.clear();for(const title of ['  Изучить localStorage  ','   ']){show('title = '+JSON.stringify(title));show(JSON.stringify(validateTaskDraft({id:'20',title,priority:'high'},[]),null,2));}};
three.onclick=async()=>{out.textContent='';console.clear();try{const r=await api.getTasks({completed:false,priority:'high'});show('GET /api/tasks?completed=false&priority=high');show('id: '+JSON.stringify(r.tasks.map(t=>t.id)));show('meta.total: '+r.meta.total);}catch(e){show(e.message)}};
four.onclick=async()=>{out.textContent='';console.clear();try{await api.getTaskById(999)}catch(error){show('getTaskById(999) — ошибка перехвачена');show('kind: '+error.kind);show('status: '+error.status)}};
</script></html>
